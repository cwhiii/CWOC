# Docker Compose override for E2E testing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build
#
# This stack:
# - Uses a separate test database
# - Runs a mock API server for external services (AI providers, print APIs)
# - Configures the app to use the mock server
# - Does NOT start GPU services (ollama, comfyui)

version: "3.9"

services:
  app:
    environment:
      DATABASE_URL: "postgresql+asyncpg://cwopod:cwopod@db:5432/cwopod_test"
      REDIS_URL: "redis://redis:6379/1"
      SECRET_KEY: "test-secret-key-for-e2e-testing-only-64chars-padding-here-ok"
      APP_URL: "http://localhost:8080"
      OLLAMA_URL: "http://mock-api:9000"
      COMFYUI_URL: "http://mock-api:9000"
      STORAGE_BACKEND: "local"
      STORAGE_PATH: "/app/storage"
      # Short session expiry for testing (2 minutes)
      SESSION_EXPIRY_MINUTES: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-api:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    environment:
      DATABASE_URL: "postgresql+asyncpg://cwopod:cwopod@db:5432/cwopod_test"
      REDIS_URL: "redis://redis:6379/1"
      SECRET_KEY: "test-secret-key-for-e2e-testing-only-64chars-padding-here-ok"
      OLLAMA_URL: "http://mock-api:9000"
      COMFYUI_URL: "http://mock-api:9000"
      STORAGE_BACKEND: "local"
      STORAGE_PATH: "/app/storage"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-api:
        condition: service_started

  db:
    environment:
      POSTGRES_DB: cwopod_test

  redis:
    command: redis-server --databases 16

  mock-api:
    build:
      context: ./e2e/mock-api
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      # Configure mock behavior
      FAIL_FIRST_AI_CALL: "true"
