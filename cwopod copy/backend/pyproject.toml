[project]
name = "cwopod"
version = "0.1.0"
description = "C.W.'s O-POD (Open Print-On-Demand) — turn public domain texts into printed books"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "bcrypt==4.2.1",
    "cryptography==44.0.0",
    "python-multipart==0.0.18",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "pillow==11.1.0",
    "qrcode==8.0",
    "pycairo==1.27.0",
    "ebooklib==0.18",
    "python-docx==1.1.2",
    "pypdf==5.1.0",
    "aioboto3==13.3.0",
    "websockets==13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
